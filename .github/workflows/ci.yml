name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [gcc-debug]

    steps:
      - uses: actions/checkout@v5

      # C++23 needs GCC 14+. raylib is built from source for the runners and
      # needs the X11/GL dev packages.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      # The presets name plain gcc/g++, so point those at version 14.
      - name: Select GCC 14
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14
          g++ --version

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
