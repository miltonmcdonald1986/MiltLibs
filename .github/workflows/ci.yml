name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # .clang-format uses MainIncludeChar, so it needs clang-format 19+. The
  # version is pinned from PyPI because formatting output can change between
  # releases; bump it together with any reformat it causes.
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install clang-format==22.1.5

      - name: Check formatting
        run: git ls-files -z '*.hpp' '*.cpp' | xargs -0 clang-format --dry-run --Werror

  # Checks every MiltLibs source, and through .clang-tidy's header filter
  # every MiltLibs header, against .clang-tidy. Sources in _deps aren't
  # checked and their headers are filtered out, so they can't fail the job.
  # clang-tidy is pinned from PyPI for the same reason as clang-format. Only
  # configure runs: clang-tidy needs compile_commands.json and the fetched
  # dependency headers, not a build. The toolchain matches the build job's
  # clang-debug leg, so the compile commands do too.
  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 clang-19 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
          pipx install clang-tidy==22.1.8

      # See the build job's step of the same name.
      - name: Select GCC 14 and Clang 19
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14
          for tool in clang clang++; do
            sudo update-alternatives --install /usr/bin/$tool $tool /usr/bin/$tool-19 100
            sudo update-alternatives --set $tool /usr/bin/$tool-19
          done

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/clang-debug/_deps
          key: deps-tidy-${{ hashFiles('cmake/*.cmake', 'libs/**/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset clang-debug

      # The positional regex picks the files to check: everything under libs/
      # except _deps, which also skips raygui's implementation in cmake/.
      - name: Run clang-tidy
        run: run-clang-tidy.py -p build/clang-debug -quiet '^(?!.*/_deps/).*/libs/'

  # Builds milt_docs, which fails on any Doxygen warning, such as an
  # undocumented parameter. Doxygen is pinned to a release binary because its
  # warnings change between versions; bump it together with any doc fixes it
  # causes. The docs preset fetches nothing, so there's no cache. Configure
  # still needs a C++ compiler, which the runner image's default g++ covers.
  docs:
    name: doxygen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          curl -sSLf -o doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_14_0/doxygen-1.14.0.linux.bin.tar.gz
          echo "e5d6ae24d0bf3f0cdc4d8f146726b89ca323922f19441af99b1872d503665ad6  doxygen.tar.gz" | sha256sum -c
          tar xzf doxygen.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.14.0/bin" >> "$GITHUB_PATH"

      - name: Build docs
        run: |
          cmake --preset docs
          cmake --build --preset docs

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: build/docs/html
          if-no-files-found: error

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Let every leg finish, so one compiler failing doesn't hide the others.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: gcc-debug }
          - { os: ubuntu-24.04, preset: gcc-release }
          - { os: ubuntu-24.04, preset: clang-debug }
          - { os: ubuntu-24.04, preset: clang-release }
          - { os: windows-latest, preset: msvc-debug }
          - { os: windows-latest, preset: msvc-release }

    steps:
      - uses: actions/checkout@v7

      # C++23 needs GCC 14+ or Clang 18+. Clang uses g++-14's libstdc++.
      # raylib is built from source for the runners and needs the X11/GL dev
      # packages.
      - name: Install toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build g++-14 clang-19 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      # The presets name plain gcc/g++ and clang/clang++, so point those at the
      # versions installed above. The runner image already registers clang++
      # as its own alternative, so it can't be a slave of clang, and --set
      # overrides any higher-priority Clang the image registered.
      - name: Select GCC 14 and Clang 19
        if: runner.os == 'Linux'
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-14
          for tool in clang clang++; do
            sudo update-alternatives --install /usr/bin/$tool $tool /usr/bin/$tool-19 100
            sudo update-alternatives --set $tool /usr/bin/$tool-19
          done
          g++ --version
          clang++ --version

      # The msvc presets use architecture strategy "external", so cl must
      # already be on PATH for x64, as in a VS developer prompt.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # FetchContent downloads googletest, GLM, raylib and raygui into _deps.
      # Their pins live in cmake/*.cmake and the libraries' CMakeLists.txt, so
      # a change there starts a fresh cache. Build trees are compiler-specific,
      # so each preset gets its own.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/*.cmake', 'libs/**/CMakeLists.txt') }}

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  # Build-only: tests are off under Emscripten. The runner is uploaded so a
  # PR's build can be tried by hand; pages.yml rebuilds it for deploys.
  web:
    name: web-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      # Sets EMSDK, which the emscripten preset's toolchainFile reads.
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache

      # Tests are off for web-release, so _deps holds GLM, raylib and raygui
      # but not googletest. See the build job's cache step.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/web-release/_deps
          key: deps-web-release-${{ hashFiles('cmake/*.cmake', 'libs/**/CMakeLists.txt') }}

      - name: Configure and build
        run: cmake --workflow --preset web-release

      - name: Upload NURBS runner
        uses: actions/upload-artifact@v7
        with:
          name: nurbs-runner-web
          path: build/web-release/libs/NURBS/milt_nurbs_runner.*
          if-no-files-found: error

  # Builds ci/consumer, which pulls MiltLibs in via add_subdirectory with
  # default options, as a consumer would. It fails if MiltLibs fetches any of
  # its development dependencies. Windows uses the default Visual Studio
  # generator, so public headers are compiled without MiltLibs' private MSVC
  # flags (see #6).
  consumer:
    name: consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install GCC 14
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S ci/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/consumer --config Release
